[project]
name = "agent-gate-backend-python"
version = "0.1.0"
description = "Reference agent_gate/v1 decide endpoint (FastAPI). Rules first, then a pluggable provider (OpenAI / Anthropic / Gemini) with an enum-constrained tool call."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
