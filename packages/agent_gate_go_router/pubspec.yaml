name: agent_gate_go_router
description: >-
  GoRouter adapter for agent_gate — AI-agnostic behavioural routing middleware
  for Flutter. Adds GoRouterAdapter and a GateRoute helper.
version: 0.1.0
homepage: https://github.com/msi-shamim/flutter_agent_gate
repository: https://github.com/msi-shamim/flutter_agent_gate/tree/master/packages/agent_gate_go_router
issue_tracker: https://github.com/msi-shamim/flutter_agent_gate/issues
topics:
  - navigation
  - go-router
  - ai
  - agent

environment:
  sdk: ^3.13.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  agent_gate: ^0.1.0
  go_router: ^17.0.0

# Inside the monorepo we develop against the local core. Remove/ignore this
# block for a published release — pub ignores dependency_overrides for consumers.
dependency_overrides:
  agent_gate:
    path: ../agent_gate

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
